<!DOCTYPE html>
<html>
<head>
  <title>Shop - Dummy Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>🛒 Dummy Store</h1>
  <a href="cart.html" class="cart-link">View Cart</a>
</header>

<div class="progress-bar">
  <span class="progress-step active"><span class="step-number">1</span> Shop</span>
  <span class="progress-connector"></span>
  <span class="progress-step"><span class="step-number">2</span> Cart</span>
  <span class="progress-connector"></span>
  <span class="progress-step"><span class="step-number">3</span> Checkout</span>
  <span class="progress-connector"></span>
  <span class="progress-step"><span class="step-number">4</span> Confirmation</span>
</div>

<div class="product-container">

  <div class="product-card">
    <h2>Headphones 🎧</h2>
    <p>$100</p>
    <button onclick="addToCart('Headphones', 100)">Add to Cart</button>
  </div>

  <div class="product-card">
    <h2>Smart Watch ⌚</h2>
    <p>$200</p>
    <button onclick="addToCart('Smart Watch', 200)">Add to Cart</button>
  </div>

  <div class="product-card">
    <h2>Bluetooth Speaker 🔊</h2>
    <p>$150</p>
    <button onclick="addToCart('Speaker', 150)">Add to Cart</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
